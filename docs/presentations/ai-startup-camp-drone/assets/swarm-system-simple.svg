<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="450" viewBox="0 0 1180 450" role="img" aria-labelledby="swarm-title swarm-desc" data-visual="swarm-system" data-status="future-goal">
  <title id="swarm-title">단일 기체에서 군집 체계로</title>
  <desc id="swarm-desc">안정된 단일 기체가 선행 조건이며 다중 기체 군집에는 공통 좌표와 시간, 통신과 상대 위치, 대형과 경로, 충돌 회피와 안전이 추가되는 후속 목표</desc>
  <defs><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#172334}.head{font-size:27px;font-weight:900}.label{font-size:24px;font-weight:800}.muted{fill:#516074}.blue{fill:#004094}</style><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L0 14L13 7Z" fill="#004094"/></marker><g id="mini-quad"><path d="M-30-22L30 22M30-22L-30 22" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><g fill="#fff" stroke="currentColor" stroke-width="3"><circle cx="-34" cy="-25" r="12"/><circle cx="34" cy="-25" r="12"/><circle cx="-34" cy="25" r="12"/><circle cx="34" cy="25" r="12"/></g><path d="M0-12L12 0L0 12L-12 0Z" fill="currentColor"/></g></defs>
  <rect width="1180" height="450" fill="#fff"/>
  <g data-prerequisite="single-drone-stability" aria-label="단일 기체 선행 조건, 자세와 위치 안정">
    <text x="210" y="65" text-anchor="middle" class="head">단일 기체 선행 조건</text>
    <circle cx="210" cy="205" r="104" fill="#eaf2fb"/>
    <g transform="translate(210 205) scale(1.4)" color="#004094"><use href="#mini-quad"/></g>
    <text x="210" y="359" text-anchor="middle" class="label blue">자세 · 위치 안정</text>
  </g>
  <path d="M348 225H468" stroke="#004094" stroke-width="6" marker-end="url(#arrow)"/>
  <g data-swarm="multi-drone" aria-label="후속 목표, 다중 기체 군집">
    <rect x="490" y="28" width="650" height="394" rx="8" fill="#fff" stroke="#004094" stroke-width="4" stroke-dasharray="12 10"/>
    <text x="815" y="68" text-anchor="middle" class="head blue">후속 목표 · 다중 기체 군집</text>
    <g color="#004094"><g transform="translate(640 166)"><use href="#mini-quad"/></g><g transform="translate(815 135)"><use href="#mini-quad"/></g><g transform="translate(990 166)"><use href="#mini-quad"/></g><g transform="translate(705 267)"><use href="#mini-quad"/></g><g transform="translate(925 267)"><use href="#mini-quad"/></g></g>
    <g fill="none" stroke="#718096" stroke-width="3" stroke-dasharray="7 7"><path d="M674 166L781 135L956 166L891 267L739 267Z"/><path d="M815 169L815 230"/></g>
    <g data-layer="shared-frame-time"><rect x="526" y="328" width="272" height="58" rx="4" fill="#f1f3f5"/><text x="662" y="366" text-anchor="middle" class="label">공통 좌표 · 시간</text></g>
    <g data-layer="communication-relative-position"><rect x="814" y="328" width="290" height="58" rx="4" fill="#f1f3f5"/><text x="959" y="366" text-anchor="middle" class="label">통신 · 상대 위치</text></g>
    <text x="815" y="414" text-anchor="middle" class="label"><tspan>대형 · 경로　│　충돌 회피 · 안전</tspan></text>
  </g>
</svg>
