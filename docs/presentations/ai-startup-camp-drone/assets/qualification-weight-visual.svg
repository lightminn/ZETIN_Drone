<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="450" viewBox="0 0 1180 450" role="img" aria-labelledby="weight-title weight-desc" data-visual="qualification-weight" data-axis="qualification-weight-criteria">
  <title id="weight-title">기체 무게와 조종자 증명</title>
  <desc id="weight-desc">4종부터 2종까지는 최대이륙중량 구간으로 나뉘고, 1종은 최대이륙중량 25킬로그램 초과와 연료를 제외한 자체중량 150킬로그램 이하를 함께 보는 다섯 구간의 눈금</desc>
  <defs>
    <style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#172334}.band{font-size:25px;font-weight:800}.sub{font-size:24px;font-weight:600;fill:#516074}.blue{fill:#004094}</style>
    <g id="drone"><path d="M-32-24L32 24M32-24L-32 24" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><g fill="#fff" stroke="currentColor" stroke-width="4"><circle cx="-36" cy="-27" r="15"/><circle cx="36" cy="-27" r="15"/><circle cx="-36" cy="27" r="15"/><circle cx="36" cy="27" r="15"/></g><rect x="-13" y="-13" width="26" height="26" transform="rotate(45)" fill="currentColor"/></g>
  </defs>
  <rect width="1180" height="450" fill="#fff"/>
  <g data-runway="weight-criteria-scale" aria-label="4종부터 2종까지는 최대이륙중량이 증가하고 1종은 자체중량 조건을 함께 확인">
    <path d="M45 286H1134" stroke="#172334" stroke-width="8"/><path d="M1110 272L1144 286L1110 300Z" fill="#172334"/>
  </g>
  <g data-band="under-250g" aria-label="250그램 이하, 증명 대상 아님">
    <path d="M45 286H260" stroke="#8b95a5" stroke-width="8"/><g transform="translate(152 186) scale(.58)" color="#718096"><use href="#drone"/></g>
    <text x="152" y="66" text-anchor="middle" class="band"><tspan x="152">250g 이하</tspan><tspan x="152" dy="34" class="sub">증명 대상 아님</tspan></text>
  </g>
  <g data-band="class-4" aria-label="4종, 250그램 초과 2킬로그램 이하, 온라인 교육">
    <path d="M260 286H475" stroke="#4d88c7" stroke-width="8"/><g transform="translate(368 180) scale(.74)" color="#4d88c7"><use href="#drone"/></g>
    <text x="368" y="55" text-anchor="middle" class="band blue"><tspan x="368">4종 · 250g–2kg</tspan><tspan x="368" dy="34" class="sub">온라인 교육</tspan></text>
  </g>
  <g data-band="class-3" aria-label="3종, 2킬로그램 초과 7킬로그램 이하, 비행경력과 학과">
    <path d="M475 286H690" stroke="#2e70b7" stroke-width="8"/><g transform="translate(582 174) scale(.92)" color="#2e70b7"><use href="#drone"/></g>
    <text x="582" y="44" text-anchor="middle" class="band blue"><tspan x="582">3종 · 2–7kg</tspan><tspan x="582" dy="34" class="sub">비행경력 · 학과</tspan></text>
  </g>
  <g data-band="class-2" aria-label="2종, 7킬로그램 초과 25킬로그램 이하, 비행경력과 학과와 실기">
    <path d="M690 286H905" stroke="#145da7" stroke-width="8"/><g transform="translate(798 166) scale(1.12)" color="#145da7"><use href="#drone"/></g>
    <text x="798" y="33" text-anchor="middle" class="band blue"><tspan x="798">2종 · 7–25kg</tspan><tspan x="798" dy="34" class="sub">비행경력 · 학과 · 실기</tspan></text>
  </g>
  <g data-band="class-1" aria-label="1종, 최대이륙중량 25킬로그램 초과, 연료 제외 자체중량 150킬로그램 이하">
    <path d="M905 286H1134" stroke="#004094" stroke-width="8"/><g transform="translate(1040 157) scale(1.36)" color="#004094"><use href="#drone"/></g>
    <text x="1040" y="24" text-anchor="middle" class="band blue"><tspan x="1040">1종 · 25kg 초과</tspan><tspan x="1040" dy="34" class="sub">자체중량 150kg 이하</tspan></text>
  </g>
  <g data-note="measure-weight-first" aria-label="종별 판단 전에 최대이륙중량과 자체중량을 실제 측정">
    <rect x="173" y="346" width="834" height="66" rx="4" fill="#fff5d9"/>
    <circle cx="208" cy="379" r="9" fill="#d49b00"/>
    <text x="235" y="388" font-size="25" font-weight="800">종별 판단 전 · 최대이륙중량과 자체중량을 실제 측정</text>
  </g>
</svg>
