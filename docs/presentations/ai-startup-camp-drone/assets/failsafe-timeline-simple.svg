<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="450" viewBox="0 0 1180 450" role="img" aria-labelledby="failsafe-title failsafe-desc" data-visual="failsafe-timeline" data-branches="rc-loss critical-fault">
  <title id="failsafe-title">상태에 따라 갈리는 페일세이프</title>
  <desc id="failsafe-desc">RC 신호 상실은 제어 하강 후 상한에 도달하면 정지하고 치명적 결함은 즉시 출력을 차단하는 두 경로</desc>
  <defs><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#172334}.label{font-size:26px;font-weight:900}.sub{font-size:24px;font-weight:700;fill:#516074}.white{fill:#fff}</style><marker id="blue-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L0 14L13 7Z" fill="#004094"/></marker><marker id="red-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L0 14L13 7Z" fill="#b04a55"/></marker></defs>
  <rect width="1180" height="450" fill="#fff"/>
  <g data-branch="rc-loss" aria-label="RC 신호 상실, 제어 하강, 상한 도달 후 정지">
    <path d="M252 148H474" stroke="#004094" stroke-width="7" marker-end="url(#blue-arrow)"/><path d="M706 148H928" stroke="#004094" stroke-width="7" marker-end="url(#blue-arrow)"/>
    <g data-state="rc-loss"><circle cx="176" cy="148" r="77" fill="#fff5d9"/><path d="M139 152C161 128 191 128 213 152M151 166C166 151 186 151 201 166" fill="none" stroke="#d49b00" stroke-width="6" stroke-linecap="round"/><path d="M139 112L213 186" stroke="#b04a55" stroke-width="7"/><text x="176" y="267" text-anchor="middle" class="label">RC 신호 상실</text></g>
    <g data-state="controlled-descent"><circle cx="590" cy="148" r="77" fill="#eaf2fb"/><path d="M545 123L635 173M635 123L545 173" stroke="#172334" stroke-width="9"/><g fill="#fff" stroke="#004094" stroke-width="4"><circle cx="540" cy="120" r="17"/><circle cx="640" cy="120" r="17"/><circle cx="540" cy="176" r="17"/><circle cx="640" cy="176" r="17"/></g><path d="M590 196V224" stroke="#004094" stroke-width="7" marker-end="url(#blue-arrow)"/><text x="590" y="267" text-anchor="middle" class="label">제어 하강</text></g>
    <g data-state="upper-limit-stop"><circle cx="1004" cy="148" r="77" fill="#f1f3f5"/><rect x="972" y="116" width="64" height="64" rx="5" fill="#172334"/><path d="M986 130L1022 166M1022 130L986 166" stroke="#fff" stroke-width="8"/><text x="1004" y="267" text-anchor="middle" class="label"><tspan x="1004">상한 도달</tspan><tspan x="1004" dy="32" class="sub">출력 정지</tspan></text></g>
  </g>
  <g data-branch="critical-fault" aria-label="치명적 결함은 즉시 차단">
    <path d="M362 363H768" stroke="#b04a55" stroke-width="7" marker-end="url(#red-arrow)"/>
    <rect x="60" y="326" width="302" height="74" rx="4" fill="#fff0f1"/><text x="211" y="372" text-anchor="middle" class="label" fill="#b04a55">치명적 결함</text>
    <rect x="788" y="326" width="332" height="74" rx="4" fill="#b04a55"/><text x="954" y="372" text-anchor="middle" class="label white">즉시 출력 차단</text>
  </g>
</svg>
