    <g transform="translate(990 186)"><use href="#quad"/></g><path d="M888 230H1092" stroke="#718096" stroke-width="7"/>
    <path d="M896 291H1084" stroke="#d9e0e7" stroke-width="4"/><path d="M896 291H948L970 285L990 245L1008 322L1028 291H1084" fill="none" stroke="#b04a55" stroke-width="7"/>
  </g>
  <g data-result="not-observable-with-imu-alone" aria-label="IMU만으로 지면 확인 불가">
    <rect x="285" y="357" width="610" height="72" rx="4" fill="#004094"/><text x="590" y="403" text-anchor="middle" class="label white">IMU만으로 지면 확인 불가</text>
