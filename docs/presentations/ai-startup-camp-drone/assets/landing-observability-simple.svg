<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="450" viewBox="0 0 1180 450" role="img" aria-labelledby="landing-title landing-desc" data-visual="landing-observability" data-conclusion="imu-only-ground-confirmation-unavailable">
  <title id="landing-title">IMU만으로 착지를 확정할 수 없는 이유</title>
  <desc id="landing-desc">지면 정지와 등속 하강은 모두 약 1g로 보이고 충격은 순간적이어서 IMU만으로 지면 접촉을 확정할 수 없음</desc>
  <defs><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#172334}.label{font-size:26px;font-weight:900}.sub{font-size:24px;font-weight:700;fill:#516074}.white{fill:#fff}</style><g id="quad"><path d="M-40-28L40 28M40-28L-40 28" stroke="#172334" stroke-width="9"/><g fill="#fff" stroke="#004094" stroke-width="4"><circle cx="-45" cy="-32" r="17"/><circle cx="45" cy="-32" r="17"/><circle cx="-45" cy="32" r="17"/><circle cx="45" cy="32" r="17"/></g><path d="M0-16L16 0L0 16L-16 0Z" fill="#004094"/></g></defs>
  <rect width="1180" height="450" fill="#fff"/>
  <g data-state="ground-rest" aria-label="지면 정지, 약 1g">
    <text x="190" y="48" text-anchor="middle" class="label"><tspan x="190">지면 정지</tspan><tspan x="190" dy="34" class="sub">약 1g</tspan></text>
    <g transform="translate(190 186)"><use href="#quad"/></g><path d="M88 230H292" stroke="#718096" stroke-width="7"/><path d="M110 246H270" stroke="#d9e0e7" stroke-width="4"/>
    <path d="M96 291H284" stroke="#23836f" stroke-width="5"/><path d="M96 291L142 290L188 292L234 290L284 291" fill="none" stroke="#23836f" stroke-width="7"/>
  </g>
  <g data-state="constant-descent" aria-label="등속 하강, 약 1g">
    <text x="590" y="48" text-anchor="middle" class="label"><tspan x="590">등속 하강</tspan><tspan x="590" dy="34" class="sub">약 1g</tspan></text>
    <g transform="translate(590 166)"><use href="#quad"/></g><path d="M590 220V258" stroke="#004094" stroke-width="7"/><path d="M574 244L590 264L606 244" fill="none" stroke="#004094" stroke-width="7"/>
    <path d="M496 291H684" stroke="#23836f" stroke-width="5"/><path d="M496 291L542 290L588 292L634 290L684 291" fill="none" stroke="#23836f" stroke-width="7"/>
  </g>
  <g data-state="impact" aria-label="충격, 순간 신호">
