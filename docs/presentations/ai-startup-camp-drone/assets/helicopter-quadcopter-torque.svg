<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="450" viewBox="0 0 1180 450" role="img" aria-labelledby="title desc">
  <title id="title">헬리콥터와 쿼드콥터의 Yaw 토크 비교</title>
  <desc id="desc">위에서 본 헬리콥터는 꼬리로터의 옆 방향 추력으로 메인로터의 반작용 토크를 상쇄하고, X형 쿼드콥터는 서로 반대 방향으로 회전하는 모터 쌍의 출력 차이로 기체를 시계 방향으로 회전시킨다.</desc>

  <defs>
    <marker id="arrow-gold" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto">
      <path d="M0 0L0 15L14 7.5Z" fill="#b47b00"/>
    </marker>
    <marker id="arrow-red" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
      <path d="M0 0L0 16L15 8Z" fill="#b04a55"/>
    </marker>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
      <path d="M0 0L0 16L15 8Z" fill="#004094"/>
    </marker>
    <marker id="arrow-blue-small" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L0 12L11 6Z" fill="#004094"/>
    </marker>
    <marker id="arrow-gold-small" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L0 12L11 6Z" fill="#b47b00"/>
    </marker>
  </defs>

  <rect width="1180" height="450" fill="#ffffff"/>
  <g font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif">
    <line x1="579" y1="18" x2="579" y2="432" stroke="#dfe5ec" stroke-width="2"/>

    <!-- Helicopter: the tail is left of the center. An upward page force at the tail produces a clockwise moment. -->
    <g aria-label="헬리콥터 패널">
      <text x="28" y="39" fill="#172334" font-size="28" font-weight="800">헬리콥터 · 반작용 토크 상쇄</text>
      <text x="28" y="70" fill="#516074" font-size="22" font-weight="500">긴 꼬리 끝의 옆 방향 힘을 이용한다</text>

      <!-- main rotor disk and blades -->
      <circle cx="352" cy="241" r="139" fill="none" stroke="#dfe5ec" stroke-width="2"/>
      <g stroke="#718096" stroke-width="7" stroke-linecap="round" opacity="0.72">
        <line x1="225" y1="190" x2="479" y2="292"/>
        <line x1="301" y1="368" x2="403" y2="114"/>
      </g>
      <circle cx="352" cy="241" r="9" fill="#004094" stroke="#ffffff" stroke-width="4"/>

      <!-- fuselage, nose and tail boom -->
      <path d="M322 217L112 231L112 251L322 265Z" fill="#516074"/>
      <path d="M306 192C360 170 435 188 491 225L509 241L491 257C435 294 360 312 306 290C285 270 285 212 306 192Z" fill="#172334" stroke="#004094" stroke-width="4"/>
      <path d="M491 225L532 241L491 257Z" fill="#004094"/>
      <text x="521" y="219" fill="#516074" font-size="22" font-weight="700">앞</text>

      <!-- top-view projection of the tail rotor: disk edge, shaft and hub -->
      <line x1="88" y1="241" x2="136" y2="241" stroke="#172334" stroke-width="8" stroke-linecap="round"/>
      <line x1="112" y1="218" x2="112" y2="264" stroke="#718096" stroke-width="4" stroke-linecap="round"/>
      <circle cx="112" cy="241" r="9" fill="#ffffff" stroke="#004094" stroke-width="4"/>

      <!-- Main rotor turns clockwise. -->
      <g data-heli-main-torque="cw">
        <path d="M352 94A147 147 0 0 1 499 241" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
        <path d="M352 94A147 147 0 0 1 499 241" fill="none" stroke="#b47b00" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-gold)"/>
        <text x="339" y="113" fill="#8a5f00" font-size="24" font-weight="800" text-anchor="middle">메인로터 CW</text>
      </g>

      <!-- The body reaction is opposite to the main rotor. -->
      <g data-heli-reaction="ccw">
        <path d="M352 169A72 72 0 0 0 280 241" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>
        <path d="M352 169A72 72 0 0 0 280 241" fill="none" stroke="#b04a55" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-red)"/>
        <text x="386" y="161" fill="#9b3f49" font-size="23" font-weight="800">동체 반작용 CCW</text>
      </g>

      <!-- At the left-hand tail, an upward force creates a clockwise moment about the body center. -->
      <g data-heli-tail-force="up">
        <path d="M112 218V126" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
        <path d="M112 218V126" fill="none" stroke="#004094" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
        <text x="28" y="112" fill="#004094" font-size="23" font-weight="800">꼬리로터 추력</text>
      </g>
      <g data-heli-counter-torque="cw">
        <path d="M442 311A114 114 0 0 1 262 311" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
        <path d="M442 311A114 114 0 0 1 262 311" fill="none" stroke="#004094" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
        <text x="352" y="420" fill="#004094" font-size="24" font-weight="800" text-anchor="middle">꼬리 힘 → CW 상쇄 토크</text>
      </g>
    </g>

    <!-- X quadcopter: front is up. Rotor labels are placed directly at each motor. -->
    <g aria-label="쿼드콥터 패널">
      <text x="606" y="39" fill="#172334" font-size="28" font-weight="800">쿼드콥터 · 기체 CW Yaw 만들기</text>
      <text x="606" y="70" fill="#516074" font-size="22" font-weight="500">CCW 로터는 올리고, CW 로터는 내린다</text>

      <!-- real X geometry and forward direction -->
      <g stroke="#172334" stroke-width="18" stroke-linecap="round">
        <line x1="731" y1="165" x2="1031" y2="322"/>
        <line x1="1031" y1="165" x2="731" y2="322"/>
      </g>
      <g stroke="#718096" stroke-width="4" stroke-linecap="round" opacity="0.7">
        <line x1="731" y1="165" x2="1031" y2="322"/>
        <line x1="1031" y1="165" x2="731" y2="322"/>
      </g>
      <text x="881" y="101" fill="#516074" font-size="22" font-weight="800" text-anchor="middle">앞</text>
      <path d="M881 143V112" fill="none" stroke="#516074" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue-small)"/>

      <!-- M1: front-left, clockwise, output decreases -->
      <g data-motor="M1" data-spin="cw" data-command="decrease" aria-label="M1 앞 왼쪽, CW, 출력 감소">
        <circle cx="731" cy="165" r="44" fill="#fffaf0" stroke="#b47b00" stroke-width="4"/>
        <path d="M731 109A56 56 0 0 1 787 165" fill="none" stroke="#b47b00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-gold-small)"/>
        <text x="731" y="161" fill="#172334" font-size="24" font-weight="900" text-anchor="middle">M1</text>
        <text x="731" y="187" fill="#8a5f00" font-size="22" font-weight="800" text-anchor="middle">CW</text>
        <text x="731" y="94" fill="#8a5f00" font-size="22" font-weight="800" text-anchor="middle">출력 ↓</text>
      </g>

      <!-- M3: front-right, counterclockwise, output increases -->
      <g data-motor="M3" data-spin="ccw" data-command="increase" aria-label="M3 앞 오른쪽, CCW, 출력 증가">
        <circle cx="1031" cy="165" r="44" fill="#f2f7fd" stroke="#004094" stroke-width="4"/>
        <path d="M1031 109A56 56 0 0 0 975 165" fill="none" stroke="#004094" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue-small)"/>
        <text x="1031" y="161" fill="#172334" font-size="24" font-weight="900" text-anchor="middle">M3</text>
        <text x="1031" y="187" fill="#004094" font-size="22" font-weight="800" text-anchor="middle">CCW</text>
        <text x="1031" y="94" fill="#004094" font-size="22" font-weight="800" text-anchor="middle">출력 ↑</text>
      </g>

      <!-- M4: rear-left, counterclockwise, output increases -->
      <g data-motor="M4" data-spin="ccw" data-command="increase" aria-label="M4 뒤 왼쪽, CCW, 출력 증가">
        <circle cx="731" cy="322" r="44" fill="#f2f7fd" stroke="#004094" stroke-width="4"/>
        <path d="M731 266A56 56 0 0 0 675 322" fill="none" stroke="#004094" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue-small)"/>
        <text x="731" y="318" fill="#172334" font-size="24" font-weight="900" text-anchor="middle">M4</text>
        <text x="731" y="344" fill="#004094" font-size="22" font-weight="800" text-anchor="middle">CCW</text>
        <text x="731" y="414" fill="#004094" font-size="22" font-weight="800" text-anchor="middle">출력 ↑</text>
      </g>

      <!-- M2: rear-right, clockwise, output decreases -->
      <g data-motor="M2" data-spin="cw" data-command="decrease" aria-label="M2 뒤 오른쪽, CW, 출력 감소">
        <circle cx="1031" cy="322" r="44" fill="#fffaf0" stroke="#b47b00" stroke-width="4"/>
        <path d="M1031 266A56 56 0 0 1 1087 322" fill="none" stroke="#b47b00" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-gold-small)"/>
        <text x="1031" y="318" fill="#172334" font-size="24" font-weight="900" text-anchor="middle">M2</text>
        <text x="1031" y="344" fill="#8a5f00" font-size="22" font-weight="800" text-anchor="middle">CW</text>
        <text x="1031" y="414" fill="#8a5f00" font-size="22" font-weight="800" text-anchor="middle">출력 ↓</text>
      </g>

      <!-- central airframe and resulting body yaw -->
      <path d="M881 195L922 219L922 267L881 291L840 267L840 219Z" fill="#172334" stroke="#004094" stroke-width="4"/>
      <path d="M881 205L895 228H867Z" fill="#ffffff"/>
      <text x="881" y="257" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle">기체</text>
      <g data-body-yaw="cw" aria-label="기체 시계 방향 Yaw">
        <path d="M881 159A84 84 0 1 1 820 301" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
        <path d="M881 159A84 84 0 1 1 820 301" fill="none" stroke="#b04a55" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-red)"/>
        <text x="881" y="380" fill="#9b3f49" font-size="26" font-weight="900" text-anchor="middle">기체 CW</text>
      </g>
    </g>
  </g>
</svg>
