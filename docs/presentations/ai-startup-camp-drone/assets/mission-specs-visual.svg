<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="474" viewBox="0 0 1180 474" role="img" aria-labelledby="mission-title mission-desc" data-visual="mission-specs" data-model="mission-drives-specification">
  <title id="mission-title">사용 분야별 핵심 사양</title>
  <desc id="mission-desc">공연, 물류, 안전 점검, 국방의 네 장면이 각 분야의 핵심 드론 사양 키워드로 연결되는 그림</desc>
  <defs><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#172334}.name{font-size:27px;font-weight:900}.spec{font-size:24px;font-weight:700}.muted{fill:#516074}.blue{fill:#004094}</style></defs>
  <rect width="1180" height="474" fill="#fff"/>
  <path d="M295 28V446M590 28V446M885 28V446" stroke="#d9e0e7" stroke-width="2"/>
  <g data-mission="entertainment" data-specs="position-accuracy time-sync lighting-control" aria-label="공연, 위치 정밀도와 시간 동기화와 조명 제어">
    <text x="147" y="44" text-anchor="middle" class="name">공연</text>
