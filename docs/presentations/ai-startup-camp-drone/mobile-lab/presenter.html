<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071522">
  <title>UOS 모바일 드론 랩 · 발표자</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="presenter-body">
  <p class="safety-boundary">
    <span class="sim-label">PRESENTER</span>
    교육용 시뮬레이션 · 학생 앱은 실제 기체와 연결되지 않습니다
  </p>

  <main id="presenter-app" class="presenter-shell">
    <header class="instrument-header">
      <div>
        <p class="eyebrow">UOS AI STARTUP CAMP · CONTROL DESK</p>
        <h1>모바일 드론 랩</h1>
      </div>
      <p class="connection-state"><span aria-hidden="true"></span> 선택 서버</p>
    </header>

    <div class="presenter-grid">
      <section class="presenter-qr-panel" aria-labelledby="join-title">
        <p class="step-code">STUDENT ENTRY</p>
        <h2 id="join-title">QR을 스캔해 바로 시작</h2>
        <div class="qr-frame" data-qr aria-live="polite"></div>
        <label class="url-field">
          <span>학생 접속 URL</span>
          <input type="url" data-student-url spellcheck="false">
        </label>
        <div class="presenter-actions">
          <button class="primary" type="button" data-action="update-qr">QR 갱신</button>
          <button class="secondary" type="button" data-action="copy-url">URL 복사</button>
        </div>
        <p class="copy-status" data-copy-status aria-live="polite"></p>
      </section>

      <section class="leaderboard-panel" aria-labelledby="board-title">
        <div class="board-heading">
          <div>
            <p class="step-code">OPTIONAL SCORE LINK</p>
            <h2 id="board-title">호버링 점수판</h2>
          </div>
          <p class="score-count"><strong data-score-count>0</strong><span>SUBMISSIONS</span></p>
        </div>
        <p class="score-disclaimer result-mode" data-score-disclaimer>
          참가자 브라우저가 제출한 교육용 비공식 결과이며, 실제 비행 성능이나 검증된 측정값이 아닙니다.
        </p>
        <p class="board-status" data-board-status role="status" aria-live="polite">점수 서버를 확인하고 있습니다.</p>
        <ol class="score-list" data-score-list>
          <li class="score-empty">아직 제출된 점수가 없습니다</li>
        </ol>
      </section>
    </div>
  </main>

  <script src="vendor/qrcode-generator/qrcode.js"></script>
  <script type="module" src="src/presenter.mjs"></script>
</body>
</html>
