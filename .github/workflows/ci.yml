name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # requirements.txt 를 그대로 쓴다. 개별 패키지를 골라 넣었더니 matplotlib
      # 다음에 pandas 가 또 걸렸다 — scripts/ 도구를 실행하는 테스트는 지상국
      # 의존성 전체를 필요로 하므로, 목록이 갈라지지 않게 선언된 파일을 쓴다.
      - name: Install ground station dependencies
        run: python -m pip install -r requirements.txt
      - name: Byte-compile PC tools
        run: python -m py_compile scripts/*.py
      - name: Repository layout checks
        run: python tools/check_repo_layout.py
      - name: Unit tests
        run: python -m unittest discover -s tools -p "test_*.py" -v

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Cache Arduino platform and libraries
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-3.3.10-icm42670p-1.0.9-esp32servo-3.2.1-bmm350-1.0.0
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install ICM42670P@1.0.9 ESP32Servo@3.2.1
          # DFRobot_BMM350 은 Arduino 라이브러리 인덱스에 없다. 주력 스케치가
          # 2026-07-24 부터 이걸 포함하는데 여기에 추가하지 않아, 그 뒤로 이 잡이
          # 계속 실패하고 있었다 — 즉 한 달간 컴파일 검증이 없었다.
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib install --git-url https://github.com/DFRobot/DFRobot_BMM350.git
      - name: Compile current sketches
        run: |
          set -e
          for sketch in firmware/flight/*/ firmware/diagnostics/*/; do
            name=$(basename "$sketch")
            echo "::group::$name"
            arduino-cli compile --warnings all \
              --fqbn esp32:esp32:esp32s3 \
              --build-path "/tmp/zetin-$name" \
              "$sketch"
            echo "::endgroup::"
          done
