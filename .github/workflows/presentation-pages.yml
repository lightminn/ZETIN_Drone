name: Deploy presentation

on:
  push:
    branches:
      - main
      - feat/magcal-ellipsoid-fit
    paths:
      - docs/presentations/ai-startup-camp-drone/index.html
      - docs/presentations/ai-startup-camp-drone/support.js
      - docs/presentations/ai-startup-camp-drone/deck-stage.js
      - docs/presentations/ai-startup-camp-drone/assets/**
      - docs/presentations/ai-startup-camp-drone/vendor/**
      - docs/presentations/ai-startup-camp-drone-10min/index.html
      - docs/presentations/ai-startup-camp-drone-10min/support.js
      - docs/presentations/ai-startup-camp-drone-10min/deck-stage.js
      - docs/presentations/ai-startup-camp-drone-10min/assets/**
      - docs/presentations/ai-startup-camp-drone-10min/vendor/**
      - tools/build_presentation_site.py
      - .github/workflows/presentation-pages.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: presentation-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build presentation site
        run: python tools/build_presentation_site.py --output _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
