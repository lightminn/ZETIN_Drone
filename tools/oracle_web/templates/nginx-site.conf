server {
	listen 80;
	listen [::]:80;
	server_name @@DOMAIN@@;
	return 308 https://@@DOMAIN@@$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name @@DOMAIN@@;

	root /srv/zetin-web/apps/@@SITE@@/current/public;
	index index.html;
	autoindex off;
	access_log off;

	ssl_certificate @@CERTIFICATE@@;
	ssl_certificate_key @@PRIVATE_KEY@@;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_tickets off;

	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header X-Frame-Options "DENY" always;
	add_header Permissions-Policy "accelerometer=(self), gyroscope=(self)" always;

	location = /api/scores {
		client_max_body_size 4096;
		limit_req zone=zetin_web_api burst=100 nodelay;
		if ($request_method !~ ^(GET|POST)$) {
			return 405;
		}
		limit_except GET POST {
			deny all;
		}
		proxy_pass http://127.0.0.1:@@PORT@@;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto https;
		proxy_connect_timeout 2s;
		proxy_send_timeout 5s;
		proxy_read_timeout 5s;
		proxy_hide_header Permissions-Policy;
	}

	location ~* \.(?:woff|woff2)$ {
		expires 1d;
		try_files $uri =404;
	}

	location ~* \.(?:html|css|mjs|js)$ {
		expires -1;
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
